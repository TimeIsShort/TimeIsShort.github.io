# Hexo 核心配置（全新重建，非旧 Yilia 脚手架）
# 说明：本文件为新源码的 Hexo 核心配置。主题为 Fluid，部署目标为 TimeIsShort.github.io 的 master 分支（已生成静态站所在分支）。
# 反推依据：线上站点 <head> 与页脚（Hexo 7.3.0 + Fluid 1.9.9、标题/作者/描述/关键词、导航、Banner）。

# Site
title: TimeIsShort's Blog
subtitle: 技术·独立·AI协同
description: 独立开发者的技术博客，记录代码、折腾与成长。
keywords: Node.js, Express, AI, MiniMax, Hexo
author: TimeIsShort
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://timeisshort.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
  pretty_urls:
    trailing_index: false
    trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
prismjs:
  enable: false

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: fluid

# Deployment
# 注意：部署目标是已生成站所在分支 master。执行 hexo deploy 会把 public/ 推到 master，覆盖线上站。
# 首次使用前请确认：1) 你在 source 分支（或本地新源码目录）操作；2) 不要把 public/ 手动推到 source 分支。
deploy:
  type: git
  repo: https://github.com/TimeIsShort/TimeIsShort.github.io.git
  branch: master
